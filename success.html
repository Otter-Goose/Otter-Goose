<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you · Otter &amp; Goose</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#EEF1EC;--ink:#16241B;--muted:#55645A;--green:#1E3B2A;--on:#F1F4EF}
@media (prefers-color-scheme:dark){:root{--bg:#101A14;--ink:#E6ECE6;--muted:#9DAEA2;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Figtree",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
h1{font:400 clamp(2.2rem,6vw,3.4rem)/1.1 "Gloock",Georgia,serif;margin:16px 0 12px}
p{color:var(--muted);max-width:44ch;margin:0 auto 28px}
a{display:inline-block;background:var(--green);color:var(--on);text-decoration:none;font-weight:600;padding:13px 24px;border-radius:2px}
svg{width:64px;height:64px;color:var(--green)}
@media (prefers-color-scheme:dark){svg{color:#CFA864}}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12 20.5l5.5 5.5L28.5 15" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  <h1>Thank you for your order</h1>
  <p>Your payment went through. A receipt is on its way to your email, and we'll let you know when your order ships.</p>
  <a href="/">Back to the shop</a>
</main>
<script>try{localStorage.removeItem('og-basket')}catch(e){}</script>
</body>
</html>
